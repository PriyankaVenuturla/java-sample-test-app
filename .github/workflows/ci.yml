name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Enterprise Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Simulate Enterprise Dependency Resolution (1,500+ Lines of Clutter)
        run: |
          echo "=========================================================="
          echo "STARTING VERBOSE ENTERPRISE DEPENDENCY RESOLUTION"
          echo "=========================================================="
          # Generate ~1,500 lines of typical CI clutter: download tickers, npm progress, passing tests
          for i in $(seq 1 400); do
            echo "Downloading: https://repo.maven.apache.org/maven2/org/springframework/boot/spring-boot-starter-$i/3.2.0/spring-boot-starter-$i-3.2.0.jar"
            echo "Downloaded from central: https://repo.maven.apache.org/maven2/org/springframework/boot/spring-boot-starter-$i/3.2.0/ (520 KB at 12.4 MB/s)"
            echo "npm http fetch GET 200 https://registry.npmjs.org/@enterprise/module-$i 32ms"
            echo "PASS src/test/java/com/demo/ServiceUnitTest$i.java (took 14ms)"
          done
          echo "=========================================================="
          echo "DEPENDENCY RESOLUTION COMPLETED - PROCEEDING TO COMPILE"
          echo "=========================================================="

      - name: Compile Java Application (Fails with Syntax Error)
        run: |
          echo "Compiling src/main/java/com/demo/TestingCode.java..."
          javac src/main/java/com/demo/TestingCode.java
